<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="3582" viewBox="0 0 1600 3582" font-family="Caveat" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  text{fill:#fff;font-family:Caveat}
  .w{stroke:#fff;fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
  .thin{stroke:#fff;fill:none;stroke-width:4;stroke-linecap:round}
  .dimln{stroke:#777;fill:none;stroke-width:4;stroke-linecap:round}
  .dim{stroke:#777;fill:none;stroke-width:6;stroke-dasharray:18 14;stroke-linecap:round}
  .r{stroke:#FF5252;fill:none;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
  .rdash{stroke:#FF5252;fill:none;stroke-width:5;stroke-dasharray:14 12;stroke-linecap:round}
  .g{stroke:#4ADE80;fill:none;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
  .c{stroke:#00FFFF;fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
  .y{stroke:#FFD700;fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
  .cy{fill:#00FFFF}.rd{fill:#FF5252}.gn{fill:#4ADE80}.gd{fill:#FFD700}.gy{fill:#8a8a8a}
  .h{font-size:78px;font-weight:700}
  .t{font-size:54px}
  .s{font-size:42px}
  .xs{font-size:34px}
  .tk{font-size:58px;font-weight:700}
  .mid{font-size:96px;font-weight:700}
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fff"/></marker>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF5252"/></marker>
  <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#00FFFF"/></marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a8a8a"/></marker>
</defs>
<rect width="1600" height="3582" fill="#000"/>
<path class="w" d="M40 40 Q800 30 1560 42 L1555 3540 Q800 3550 45 3538 Z"/>
<path class="w" d="M45 1210 Q800 1195 1555 1215"/>
<path class="w" d="M45 2400 Q800 2415 1555 2398"/>

<!-- PANEL 1 : The running summary -->
<circle class="w" cx="118" cy="128" r="38"/><text class="h" x="98" y="155">1</text>
<text class="h" x="188" y="152">The running summary</text>

<!-- turn strip -->
<g transform="translate(100 250)">
  <path class="w" d="M0 0 H1400 V110 H0 Z"/>
  <path class="thin" d="M350 0 V110 M700 0 V110 M1050 0 V110"/>
  <text class="xs gy" x="20" y="-18">turns 1-10</text>
  <text class="xs gy" x="370" y="-18">11-20</text>
  <text class="xs gy" x="720" y="-18">21-30</text>
  <text class="xs gy" x="1070" y="-18">31-40</text>
  <text class="s cy" x="20" y="50">t5 Pune</text>
  <text class="xs" x="20" y="92">gate: evening</text>
  <text class="s cy" x="1070" y="70">t40 Chennai</text>
  <path class="dimln" d="M360 10 L690 100 M690 10 L360 100 M710 10 L1040 100 M1040 10 L710 100"/>
</g>
<text class="xs gy" x="470" y="410">every 10 turns: drop old turns,</text>
<text class="xs gy" x="470" y="448">rewrite the summary (save tokens)</text>

<!-- rewrites -->
<path class="thin" d="M420 380 L420 475" marker-end="url(#a)"/>
<g transform="translate(100 490)">
  <path class="w" d="M0 0 H400 V250 H0 Z"/>
  <text class="xs gy" x="20" y="-14">summary v1</text>
  <text class="t" x="30" y="75">Pune</text>
  <text class="t rd" x="30" y="150">gate: evening</text>
  <path class="dimln" d="M30 200 H330"/>
</g>
<path class="thin" d="M520 615 L620 615" marker-end="url(#a)"/>
<g transform="translate(640 515)">
  <path class="w" d="M0 0 H340 V200 H0 Z"/>
  <text class="xs gy" x="20" y="-14">v2, v3</text>
  <text class="t" x="30" y="75">Pune</text>
  <path class="dimln" d="M30 130 H280 M30 165 H220"/>
</g>
<path class="thin" d="M1000 615 L1100 615" marker-end="url(#a)"/>
<g transform="translate(1120 535)">
  <path class="w" d="M0 0 H330 V170 H0 Z"/>
  <text class="xs gy" x="20" y="-14">v4</text>
  <text class="xs rd" x="150" y="-14">which one?</text>
  <text class="t" x="30" y="75">Pune ...</text>
  <text class="t" x="30" y="140">Chennai</text>
  <text class="mid rd" x="250" y="125">?</text>
</g>

<!-- dropped fact -->
<path class="r" d="M300 760 Q320 830 290 900" marker-end="url(#ar)"/>
<text class="t rd" x="120" y="950">gate: evening, dropped</text>

<text class="tk gd" x="100" y="1030">RULE 1: keep the raw turns.</text>
<text class="tk gd" x="100" y="1095">The summary only points into them</text>
<path class="y" d="M100 1113 Q480 1105 930 1115"/>
<text class="s gd" x="110" y="1168">for this chat: turns 5 and 40</text>

<!-- PANEL 2 : The memory graph -->
<circle class="w" cx="118" cy="1298" r="38"/><text class="h" x="98" y="1325">2</text>
<text class="h" x="188" y="1322">The memory graph</text>

<!-- extraction step -->
<text class="xs" x="640" y="1405">each turn</text>
<path class="thin" d="M790 1393 L850 1393" marker-end="url(#a)"/>
<path class="c" d="M865 1355 H1135 V1425 H865 Z"/>
<text class="xs cy" x="885" y="1405">+1 model call</text>
<path class="thin" d="M1150 1393 L1210 1393" marker-end="url(#a)"/>
<text class="xs" x="1225" y="1405">facts</text>

<!-- questions -->
<text class="xs cy" x="100" y="1400">customer:</text>
<text class="s cy" x="100" y="1450">"where's it going?"</text>
<path class="c" d="M300 1475 Q360 1530 420 1570" marker-end="url(#ac)"/>
<text class="xs cy" x="100" y="2095">driver:</text>
<text class="s cy" x="100" y="2145">"when do I arrive?"</text>
<path class="c" d="M300 2060 Q360 2040 420 2015" marker-end="url(#ac)"/>

<!-- nodes -->
<circle class="w" cx="540" cy="1650" r="115" style="stroke-width:8"/>
<text class="t" x="460" y="1668">ORDER</text>
<circle class="w" cx="540" cy="1930" r="115" style="stroke-width:8"/>
<text class="s" x="448" y="1945">BUILDING</text>

<!-- edges -->
<path class="dim" d="M650 1610 L1080 1490" marker-end="url(#ag)"/>
<text class="xs gy" x="760" y="1510">deliver_to · t5</text>
<text class="t gy" x="1100" y="1500">Pune</text>
<path class="dimln" d="M1095 1478 H1200" style="stroke-width:3"/>
<text class="xs gy" x="1235" y="1500">old</text>

<path class="w" d="M655 1680 L1080 1720" marker-end="url(#a)" style="stroke-width:8"/>
<text class="xs" x="760" y="1670">deliver_to · t40</text>
<text class="mid gn" x="1100" y="1750">Chennai</text>
<text class="xs gn" x="1105" y="1810">same key, newer wins</text>

<path class="w" d="M655 1930 L1080 1930" marker-end="url(#a)"/>
<text class="xs" x="760" y="1905">gate_closes</text>
<text class="t" x="1100" y="1948">evening</text>

<text class="tk gd" x="100" y="2255">RULE 2: entity · property · value + timestamp.</text>
<text class="tk gd" x="100" y="2320">Newest value on a key wins</text>
<path class="y" d="M100 2338 Q450 2330 740 2340"/>
<text class="s gd" x="110" y="2385">for this order: deliver_to = Chennai</text>

<!-- PANEL 3 : Loose keys -->
<circle class="w" cx="118" cy="2488" r="38"/><text class="h" x="98" y="2515">3</text>
<text class="h" x="188" y="2512">Loose keys</text>

<circle class="w" cx="360" cy="2790" r="115" style="stroke-width:8"/>
<text class="t" x="280" y="2808">ORDER</text>

<path class="w" d="M470 2750 L880 2650" marker-end="url(#a)"/>
<text class="xs" x="560" y="2660">deliver_to</text>
<text class="t" x="900" y="2665">Pune</text>

<path class="w" d="M470 2830 L880 2930" marker-end="url(#a)"/>
<text class="xs rd" x="560" y="2940">shipping_city · t40</text>
<text class="t" x="900" y="2945">Chennai</text>

<path class="r" d="M1110 2650 Q1180 2795 1110 2930"/>
<text class="mid rd" x="1180" y="2830" style="font-size:84px">2 answers</text>

<!-- fixed key list -->
<g transform="translate(100 3040)">
  <path class="g" d="M0 0 H720 V230 H0 Z"/>
  <text class="xs gn" x="24" y="-14">allowed properties</text>
  <text class="s" x="30" y="65">deliver_to</text>
  <text class="s" x="30" y="125">gate_closes</text>
  <text class="s rd" x="30" y="190">shipping_city</text>
  <path class="r" d="M25 177 H280" style="stroke-width:6"/>
  <text class="s rd" x="310" y="190">rejected</text>
</g>

<!-- thread stays in summary -->
<g transform="translate(900 3040)">
  <path class="w" d="M0 0 H600 V230 H0 Z" style="stroke-dasharray:18 14"/>
  <text class="xs gy" x="24" y="-14">short summary: the thread</text>
  <text class="s" x="30" y="90">refund in progress,</text>
  <text class="s" x="30" y="160">waiting on photo</text>
</g>

<text class="tk gd" x="100" y="3385">RULE 3: fix the property names</text>
<text class="tk gd" x="100" y="3450">before the first write. Reject the rest</text>
<path class="y" d="M100 3468 Q520 3460 1000 3470"/>
<text class="s gd" x="110" y="3515">for this order: deliver_to, never shipping_city</text>
</svg>
