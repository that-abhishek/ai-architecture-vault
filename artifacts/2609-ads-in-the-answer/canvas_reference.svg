<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="3582" viewBox="0 0 1600 3582" font-family="Caveat" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  text{fill:#fff;font-family:Caveat}
  .w{stroke:#fff;fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
  .thin{stroke:#fff;fill:none;stroke-width:4;stroke-linecap:round}
  .dimln{stroke:#777;fill:none;stroke-width:4;stroke-linecap:round}
  .r{stroke:#FF5252;fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
  .g{stroke:#4ADE80;fill:none;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
  .c{stroke:#00FFFF;fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
  .y{stroke:#FFD700;fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
  .cy{fill:#00FFFF}.rd{fill:#FF5252}.gn{fill:#4ADE80}.gd{fill:#FFD700}
  .h{font-size:78px;font-weight:700}
  .t{font-size:54px}
  .s{font-size:42px}
  .xs{font-size:34px}
  .tk{font-size:58px;font-weight:700}
  .big{font-size:150px;font-weight:700}
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fff"/></marker>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF5252"/></marker>
</defs>
<rect width="1600" height="3582" fill="#000"/>
<path class="w" d="M40 40 Q800 30 1560 42 L1555 3540 Q800 3550 45 3538 Z"/>
<path class="w" d="M45 1210 Q800 1195 1555 1215"/>
<path class="w" d="M45 2400 Q800 2415 1555 2398"/>

<!-- PANEL 1 -->
<circle class="w" cx="118" cy="128" r="38"/><text class="h" x="98" y="155">1</text>
<text class="h" x="188" y="152">A label needs a thing</text>
<g transform="translate(100 300)">
  <path class="w" d="M0 0 H1000 V120 H0 Z"/>
  <path class="dimln" d="M40 45 H700 M40 85 H520"/>
  <text class="s gd" x="790" y="52">Sponsored</text>
  <path class="dimln" d="M40 200 H820 M40 240 H600"/>
  <path class="dimln" d="M40 320 H860 M40 360 H540"/>
  <path class="dimln" d="M40 440 H780 M40 480 H640"/>
</g>
<path class="thin" d="M1250 390 L1120 360" marker-end="url(#a)"/>
<text class="s" x="1260" y="405">click</text>
<text class="tk gd" x="100" y="1060">RULE: a label works on a slot,</text>
<text class="tk gd" x="100" y="1130">not on a sentence</text>
<path class="y" d="M100 1150 Q600 1140 1140 1152"/>

<!-- PANEL 2 -->
<circle class="w" cx="118" cy="1298" r="38"/><text class="h" x="98" y="1325">2</text>
<text class="h" x="188" y="1322">Four placements</text>
<g transform="translate(600 1420)">
  <path class="w" d="M0 0 H820 V560 H0 Z"/>
  <path class="dimln" d="M40 60 Q200 50 380 62 T740 58"/>
  <path class="dimln" d="M40 120 Q220 112 420 122 T700 118"/>
  <path class="w" d="M40 180 H760 V250 H40 Z"/>
  <path class="dimln" d="M70 215 H500"/>
  <text class="xs gd" x="580" y="228">Sponsored</text>
  <path class="dimln" d="M40 320 Q200 312 380 322 T760 318"/>
  <path class="dimln" d="M40 380 Q220 372 420 382 T680 378"/>
  <path class="dimln" d="M40 440 Q200 432 380 442 T740 438"/>
  <path class="dimln" d="M40 500 Q220 492 420 502 T600 498"/>
</g>
<text class="t rd" x="100" y="1470">4  system prompt</text>
<path class="r" d="M540 1450 L600 1450" marker-end="url(#ar)"/>
<text class="t" x="100" y="1645">2  the list</text>
<path class="thin" d="M420 1630 L640 1630" marker-end="url(#a)"/>
<text class="t rd" x="100" y="1790">3  the page</text>
<path class="r" d="M420 1770 L600 1770" marker-end="url(#ar)"/>
<g transform="translate(600 2010)">
  <path class="g" d="M0 0 H820 V90 H0 Z"/>
  <text class="s gn" x="30" y="60">1  slot under the answer</text>
</g>
<text class="big rd" x="100" y="2270">61 → 55</text>
<text class="xs rd" x="470" y="2310">labelled</text>
<text class="big gn" x="1040" y="2270">22</text>
<text class="xs gn" x="1045" y="2310">search</text>
<text class="tk gd" x="100" y="2375">RULE: past the slot, the label stops working</text>
<path class="y" d="M100 2390 Q700 2380 1300 2392"/>

<!-- PANEL 3 -->
<circle class="w" cx="118" cy="2488" r="38"/><text class="h" x="98" y="2515">3</text>
<text class="h" x="188" y="2512">The only check</text>
<text class="t" x="100" y="2630">you</text>
<path class="r" d="M90 2610 L200 2610"/>
<text class="t" x="100" y="2715">the label</text>
<path class="r" d="M90 2695 L320 2695"/>
<text class="t" x="100" y="2800">the rulebook</text>
<path class="r" d="M90 2780 L395 2780"/>
<text class="t gn" x="100" y="2960">same question        → laptop A</text>
<text class="t gn" x="100" y="3040">same question − $   → laptop B</text>
<path class="g" d="M1000 2925 Q1050 2990 1000 3055"/>
<text class="t gn" x="1070" y="3005">diff</text>
<g transform="translate(100 3110)">
  <path class="c" d="M0 0 H720 V220 H0 Z"/>
  <text class="t cy" x="30" y="65">never paid to say:</text>
  <path class="dimln" d="M60 120 H660 M60 170 H660"/>
</g>
<text class="tk gd" x="100" y="3420">RULE: the only check is a diff.</text>
<text class="tk gd" x="100" y="3490">build it, or ask twice</text>
<path class="y" d="M100 3510 Q500 3500 900 3512"/>
</svg>
