<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="3582" viewBox="0 0 1600 3582" font-family="Caveat" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  text{fill:#fff;font-family:Caveat}
  .w{stroke:#fff;fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
  .thin{stroke:#fff;fill:none;stroke-width:4;stroke-linecap:round}
  .dimln{stroke:#777;fill:none;stroke-width:4;stroke-linecap:round}
  .r{stroke:#FF5252;fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
  .g{stroke:#4ADE80;fill:none;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
  .gdash{stroke:#4ADE80;fill:none;stroke-width:7;stroke-dasharray:24 16;stroke-linecap:round}
  .wdash{stroke:#fff;fill:none;stroke-width:5;stroke-dasharray:20 14;stroke-linecap:round}
  .c{stroke:#00FFFF;fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
  .y{stroke:#FFD700;fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
  .cy{fill:#00FFFF}.rd{fill:#FF5252}.gn{fill:#4ADE80}.gd{fill:#FFD700}
  .h{font-size:78px;font-weight:700}
  .t{font-size:54px}
  .s{font-size:42px}
  .xs{font-size:34px}
  .tk{font-size:58px;font-weight:700}
  .big{font-size:150px;font-weight:700}
  .mid{font-size:96px;font-weight:700}
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fff"/></marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4ADE80"/></marker>
</defs>
<rect width="1600" height="3582" fill="#000"/>
<path class="w" d="M40 40 Q800 30 1560 42 L1555 3540 Q800 3550 45 3538 Z"/>
<path class="w" d="M45 1210 Q800 1195 1555 1215"/>
<path class="w" d="M45 2400 Q800 2415 1555 2398"/>

<!-- PANEL 1 : Two tickets, two runs -->
<circle class="w" cx="118" cy="128" r="38"/><text class="h" x="98" y="155">1</text>
<text class="h" x="188" y="152">Two tickets, two runs</text>

<g transform="translate(100 260)"><path class="w" d="M0 0 H300 V110 H0 Z"/><text class="t" x="40" y="72">email</text></g>
<g transform="translate(100 500)"><path class="w" d="M0 0 H300 V110 H0 Z"/><text class="t" x="40" y="72">chat</text></g>
<path class="thin" d="M415 315 L535 315" marker-end="url(#a)"/>
<path class="thin" d="M415 555 L535 555" marker-end="url(#a)"/>
<g transform="translate(550 250)"><path class="w" d="M0 0 H300 V130 H0 Z"/><text class="t" x="60" y="82">run 1</text></g>
<g transform="translate(550 490)"><path class="w" d="M0 0 H300 V130 H0 Z"/><text class="t" x="60" y="82">run 2</text></g>
<!-- no link between runs -->
<path class="wdash" d="M700 390 L700 480"/>
<path class="r" d="M675 410 L725 460 M725 410 L675 460" style="stroke-width:7"/>
<text class="s cy" x="880" y="320">refund()</text>
<text class="s cy" x="880" y="620">refund()</text>
<path class="thin" d="M865 345 L1105 405" marker-end="url(#a)"/>
<path class="thin" d="M865 555 L1105 495" marker-end="url(#a)"/>
<g transform="translate(1120 340)"><path class="w" d="M0 0 H360 V200 H0 Z" style="stroke-width:10"/><text class="mid" x="50" y="135">ORDER</text></g>

<text class="big rd" x="100" y="840">Rs 1200 × 2</text>

<text class="tk gd" x="100" y="1010">RULE: key every action on the thing it changes,</text>
<text class="tk gd" x="100" y="1080">not the ticket or the run</text>
<path class="y" d="M100 1098 Q400 1090 720 1100"/>
<text class="s" x="130" y="1160">for a refund: the order line</text>

<!-- PANEL 2 : Why your key missed -->
<circle class="w" cx="118" cy="1298" r="38"/><text class="h" x="98" y="1325">2</text>
<text class="h" x="188" y="1322">Why your key missed</text>

<text class="s" x="100" y="1420">double click</text>
<g transform="translate(100 1440)"><path class="w" d="M0 0 H220 V90 H0 Z"/><text class="t" x="35" y="62">key A</text></g>
<g transform="translate(350 1440)"><path class="w" d="M0 0 H220 V90 H0 Z"/><text class="t" x="35" y="62">key A</text></g>
<path class="thin" d="M590 1485 L700 1485" marker-end="url(#a)"/>
<text class="t gn" x="720" y="1502">blocked</text>
<path class="g" d="M920 1475 L945 1503 L990 1447"/>

<text class="s" x="100" y="1610">run 2</text>
<g transform="translate(100 1630)"><path class="w" d="M0 0 H220 V90 H0 Z"/><text class="t" x="35" y="62">key A</text></g>
<g transform="translate(350 1630)"><path class="r" d="M0 0 H220 V90 H0 Z" style="stroke-width:6"/><text class="t rd" x="35" y="62">key B</text></g>
<path class="thin" d="M590 1675 L700 1675" marker-end="url(#a)"/>
<text class="t rd" x="720" y="1692">passes</text>
<path class="r" d="M920 1650 L970 1700 M970 1650 L920 1700"/>

<g transform="translate(100 1810)"><path class="w" d="M0 0 H330 V100 H0 Z"/><text class="t" x="35" y="66">check order</text></g>
<path class="thin" d="M445 1860 L545 1860" marker-end="url(#a)"/>
<g transform="translate(560 1780)">
  <path class="w" d="M0 0 H480 V160 H0 Z"/>
  <text class="xs" x="30" y="45">order page</text>
  <path class="dimln" d="M30 65 H450"/>
  <text class="t" x="30" y="130">NOT REFUNDED</text>
</g>
<text class="s rd" x="570" y="1995">bank: still settling</text>
<path class="r" d="M1090 1830 L1150 1890 M1150 1830 L1090 1890"/>

<text class="mid cy" x="100" y="2120">request</text><text class="mid cy" x="420" y="2120">=</text><path class="c" d="M425 2130 L480 2040" style="stroke-width:8"/><text class="mid cy" x="510" y="2120">decision</text>

<text class="tk gd" x="100" y="2240">RULE: record every action yourself</text>
<text class="tk gd" x="100" y="2310">before calling out, then check your record</text>
<path class="y" d="M100 2328 Q480 2320 1000 2330"/>
<text class="s" x="130" y="2380">for a refund: your ledger</text>

<!-- PANEL 3 : The tool says no -->
<circle class="w" cx="118" cy="2488" r="38"/><text class="h" x="98" y="2515">3</text>
<text class="h" x="188" y="2512">The tool says no</text>

<g transform="translate(100 2650)"><path class="w" d="M0 0 H280 V130 H0 Z"/><text class="t" x="50" y="82">run 2</text></g>
<text class="s cy" x="395" y="2690">refund()</text>
<path class="thin" d="M395 2715 L545 2715" marker-end="url(#a)"/>
<g transform="translate(560 2600)">
  <path class="w" d="M0 0 H520 V260 H0 Z" style="stroke-width:10"/>
  <text class="t" x="40" y="70">LEDGER</text>
  <path class="w" d="M40 110 H480 V210 H40 Z"/>
  <text class="s" x="70" y="175">order line</text>
  <path class="g" d="M380 160 L405 188 L450 132"/>
</g>

<text class="xs" x="1120" y="2640">goodwill</text>
<text class="xs" x="1120" y="2680">credit</text>
<path class="wdash" d="M1095 2730 L1225 2730" marker-end="url(#a)"/>
<g transform="translate(1240 2680)"><path class="y" d="M0 0 H270 V110 H0 Z"/><text class="t gd" x="45" y="72">human</text></g>

<path class="g" d="M820 2875 L820 2975" marker-end="url(#ag)"/>
<text class="t gn" x="560" y="3050">already started</text>
<path class="g" d="M960 3035 L1115 3035" marker-end="url(#ag)"/>
<g transform="translate(1130 2980)"><path class="w" d="M0 0 H330 V110 H0 Z"/><text class="t" x="40" y="72">customer</text></g>

<text class="mid gn" x="100" y="3220">Rs 0 moved</text>

<text class="tk gd" x="100" y="3380">RULE: one automatic run for any action</text>
<text class="tk gd" x="100" y="3450">you can't undo</text>
<path class="y" d="M100 3468 Q260 3460 420 3470"/>
<text class="s" x="130" y="3520">for a refund: a 2nd one goes to a human</text>
</svg>
