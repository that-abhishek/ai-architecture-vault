<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="3582" viewBox="0 0 1600 3582" font-family="Caveat" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  text{fill:#fff;font-family:Caveat}
  .w{stroke:#fff;fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
  .thin{stroke:#fff;fill:none;stroke-width:4;stroke-linecap:round}
  .dimln{stroke:#777;fill:none;stroke-width:4;stroke-linecap:round}
  .r{stroke:#FF5252;fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
  .g{stroke:#4ADE80;fill:none;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
  .gdash{stroke:#4ADE80;fill:none;stroke-width:7;stroke-dasharray:24 16;stroke-linecap:round}
  .c{stroke:#00FFFF;fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
  .y{stroke:#FFD700;fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
  .yb{stroke:#FFD700;fill:none;stroke-width:10;stroke-linecap:round}
  .cy{fill:#00FFFF}.rd{fill:#FF5252}.gn{fill:#4ADE80}.gd{fill:#FFD700}
  .barg{fill:#4ADE80}.barr{fill:#FF5252}
  .h{font-size:78px;font-weight:700}
  .t{font-size:54px}
  .s{font-size:42px}
  .xs{font-size:34px}
  .tk{font-size:58px;font-weight:700}
  .big{font-size:150px;font-weight:700}
  .mid{font-size:96px;font-weight:700}
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fff"/></marker>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF5252"/></marker>
</defs>
<rect width="1600" height="3582" fill="#000"/>
<path class="w" d="M40 40 Q800 30 1560 42 L1555 3540 Q800 3550 45 3538 Z"/>
<path class="w" d="M45 1210 Q800 1195 1555 1215"/>
<path class="w" d="M45 2400 Q800 2415 1555 2398"/>

<!-- PANEL 1 : The judge -->
<circle class="w" cx="118" cy="128" r="38"/><text class="h" x="98" y="155">1</text>
<text class="h" x="188" y="152">The judge</text>

<g transform="translate(100 260)">
  <path class="w" d="M0 0 H380 V200 H0 Z"/>
  <text class="s" x="30" y="60">answer</text>
  <path class="dimln" d="M30 95 H330 M30 135 H260"/>
  <text class="xs" x="30" y="185">+ source</text>
</g>
<path class="thin" d="M500 360 L600 360" marker-end="url(#a)"/>
<g transform="translate(620 230)">
  <path class="w" d="M0 0 H480 V260 H0 Z" style="stroke-width:10"/>
  <text class="t" x="50" y="110">FRONTIER</text>
  <text class="t" x="50" y="190">JUDGE</text>
</g>
<path class="thin" d="M1120 360 L1230 360" marker-end="url(#a)"/>
<text class="mid" x="1250" y="390">yes</text>

<text class="big rd" x="100" y="780">$33,000</text>
<text class="s rd" x="110" y="850">per 1M checks</text>

<text class="xs" x="960" y="610">sure</text>
<text class="t" x="950" y="680">yes</text>
<text class="xs" x="1250" y="610">coin toss</text>
<text class="t" x="1270" y="680">yes</text>
<path class="thin" d="M1000 710 L1110 860" marker-end="url(#a)"/>
<path class="thin" d="M1310 710 L1200 860" marker-end="url(#a)"/>
<g transform="translate(1000 880)">
  <path class="c" d="M0 0 H320 V90 H0 Z"/>
  <text class="s cy" x="40" y="60">if (yes)</text>
</g>

<text class="tk gd" x="100" y="1060">RULE: move yes/no checks</text>
<text class="tk gd" x="100" y="1130">off the frontier model</text>
<path class="y" d="M100 1150 Q380 1142 660 1152"/>

<!-- PANEL 2 : A model that only picks -->
<circle class="w" cx="118" cy="1298" r="38"/><text class="h" x="98" y="1325">2</text>
<text class="h" x="188" y="1322">A model that only picks</text>

<text class="t" x="100" y="1480">question</text>
<path class="thin" d="M345 1462 L420 1420" marker-end="url(#a)"/>
<path class="thin" d="M345 1462 L420 1520" marker-end="url(#a)"/>
<text class="t" x="440" y="1432">yes</text>
<path class="w" d="M560 1385 H1160 V1445 H560 Z"/>
<rect class="barg" x="566" y="1391" width="552" height="48"/>
<text class="t gn" x="1190" y="1432">0.93</text>
<text class="t" x="440" y="1542">no</text>
<path class="w" d="M560 1495 H1160 V1555 H560 Z"/>
<rect class="barr" x="566" y="1501" width="40" height="48"/>
<text class="t rd" x="1190" y="1542">0.07</text>

<!-- threshold scale -->
<path class="w" d="M150 1720 H1450"/>
<path class="thin" d="M150 1695 V1745 M1450 1695 V1745 M930 1695 V1745"/>
<path class="yb" d="M1385 1660 V1780"/>
<text class="xs" x="140" y="1800">0</text>
<text class="xs" x="915" y="1800">0.6</text>
<text class="s gd" x="1345" y="1830">0.95</text>
<text class="xs" x="1440" y="1800">1</text>
<path class="c" d="M935 1660 Q1155 1620 1375 1660"/>
<text class="s cy" x="1080" y="1625">person</text>
<text class="s gn" x="1390" y="1640">ship</text>

<!-- numbers -->
<text class="mid gn" x="100" y="1970">Jev</text>
<text class="t gn" x="290" y="1960">91.5% agree</text>
<text class="big gn" x="100" y="2150">$160</text>
<text class="mid rd" x="620" y="2130">$33,000</text>
<path class="r" d="M605 2100 L910 2085"/>
<text class="xs" x="940" y="2130">per 1M checks</text>

<text class="tk gd" x="100" y="2280">RULE: route on the probability,</text>
<text class="tk gd" x="100" y="2350">not on the word</text>
<path class="y" d="M100 2368 Q420 2360 740 2370"/>

<!-- PANEL 3 : The cake recipe -->
<circle class="w" cx="118" cy="2488" r="38"/><text class="h" x="98" y="2515">3</text>
<text class="h" x="188" y="2512">The cake recipe</text>

<g transform="translate(130 2640)">
  <path class="w" d="M0 150 H300 V270 H0 Z"/>
  <path class="w" d="M30 150 V80 H270 V150"/>
  <path class="thin" d="M30 115 Q90 140 150 115 T270 115"/>
  <path class="w" d="M150 80 V20"/>
  <path class="r" d="M150 -20 Q170 0 150 12 Q130 0 150 -20 Z" style="stroke-width:6"/>
</g>
<path class="thin" d="M470 2820 L600 2790" marker-end="url(#a)"/>

<g transform="translate(620 2600)">
  <path class="w" d="M0 0 H560 V100 H0 Z"/>
  <text class="t" x="40" y="68">billing</text>
</g>
<g transform="translate(620 2740)">
  <path class="r" d="M0 0 H560 V100 H0 Z"/>
  <text class="t rd" x="40" y="68">technical  0.94</text>
</g>
<g transform="translate(620 2880)">
  <path class="w" d="M0 0 H560 V100 H0 Z"/>
  <text class="t" x="40" y="68">account</text>
</g>
<g transform="translate(620 3030)">
  <path class="gdash" d="M0 0 H560 V100 H0 Z"/>
  <text class="t gn" x="40" y="68">none of these</text>
</g>

<text class="big rd" x="100" y="3150">0 / 30</text>
<text class="s rd" x="110" y="3220">flagged</text>

<text class="tk gd" x="100" y="3420">RULE: give every question</text>
<text class="tk gd" x="100" y="3490">a "none of these" box</text>
<path class="y" d="M100 3510 Q350 3502 620 3512"/>
</svg>
