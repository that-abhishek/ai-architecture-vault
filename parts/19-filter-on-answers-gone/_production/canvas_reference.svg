<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="3582" viewBox="0 0 1600 3582" font-family="Caveat" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  text{fill:#fff;font-family:Caveat}
  .w{stroke:#fff;fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
  .thin{stroke:#fff;fill:none;stroke-width:4;stroke-linecap:round}
  .dimln{stroke:#777;fill:none;stroke-width:4;stroke-linecap:round}
  .r{stroke:#FF5252;fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
  .g{stroke:#4ADE80;fill:none;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
  .wdash{stroke:#fff;fill:none;stroke-width:5;stroke-dasharray:20 14;stroke-linecap:round}
  .c{stroke:#00FFFF;fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
  .y{stroke:#FFD700;fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
  .cy{fill:#00FFFF}.rd{fill:#FF5252}.gn{fill:#4ADE80}.gd{fill:#FFD700}
  .h{font-size:78px;font-weight:700}
  .t{font-size:54px}
  .s{font-size:42px}
  .xs{font-size:34px}
  .tk{font-size:58px;font-weight:700}
  .mid{font-size:96px;font-weight:700}
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fff"/></marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4ADE80"/></marker>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF5252"/></marker>
</defs>
<rect width="1600" height="3582" fill="#000"/>
<path class="w" d="M40 40 Q800 30 1560 42 L1555 3540 Q800 3550 45 3538 Z"/>
<path class="w" d="M45 1210 Q800 1195 1555 1215"/>
<path class="w" d="M45 2400 Q800 2415 1555 2398"/>

<!-- PANEL 1 : The filter ran last -->
<circle class="w" cx="118" cy="128" r="38"/><text class="h" x="98" y="155">1</text>
<text class="h" x="188" y="152">The filter ran last</text>

<!-- 1. intern + question -->
<circle class="w" cx="170" cy="250" r="34"/>
<path class="w" d="M170 284 L170 380 M120 320 L220 320 M170 380 L130 440 M170 380 L210 440"/>
<text class="xs" x="118" y="480">intern</text>
<path class="w" d="M270 210 H1040 Q1060 210 1060 230 V300 Q1060 320 1040 320 H330 L290 355 L300 320 H290 Q270 320 270 300 Z"/>
<text class="t" x="300" y="285">can I carry over unused leave?</text>

<!-- 2. agent -> search -> top 5 -->
<g transform="translate(100 560)"><path class="w" d="M0 0 H230 V110 H0 Z"/><text class="t" x="38" y="72">Agent</text></g>
<path class="thin" d="M345 615 L425 615" marker-end="url(#a)"/>
<g transform="translate(440 560)"><path class="w" d="M0 0 H230 V110 H0 Z"/><text class="t" x="35" y="72">search</text></g>
<path class="thin" d="M685 615 L755 615" marker-end="url(#a)"/>
<text class="s" x="790" y="440">top 5</text>
<!-- 3. five MGR docs -->
<g transform="translate(770 460)">
  <path class="w" d="M0 0 H400 V56 H0 Z"/><text class="xs rd" x="20" y="40">MGR: encashment</text>
  <path class="w" d="M0 66 H400 V122 H0 Z"/><text class="xs rd" x="20" y="106">MGR</text>
  <path class="w" d="M0 132 H400 V188 H0 Z"/><text class="xs rd" x="20" y="172">MGR</text>
  <path class="w" d="M0 198 H400 V254 H0 Z"/><text class="xs rd" x="20" y="238">MGR</text>
  <path class="w" d="M0 264 H400 V320 H0 Z"/><text class="xs rd" x="20" y="304">MGR</text>
</g>
<!-- 4. role filter gate, all crossed, empty tray -->
<text class="xs" x="1215" y="440">role filter</text>
<path class="w" d="M1230 460 L1300 600 L1300 700 M1370 460 L1300 600" style="stroke-width:7"/>
<path class="r" d="M1100 474 L1140 508 M1140 474 L1100 508" style="stroke-width:7"/><path class="r" d="M1100 540 L1140 574 M1140 540 L1100 574" style="stroke-width:7"/><path class="r" d="M1100 606 L1140 640 M1140 606 L1100 640" style="stroke-width:7"/><path class="r" d="M1100 672 L1140 706 M1140 672 L1100 706" style="stroke-width:7"/><path class="r" d="M1100 738 L1140 772 M1140 738 L1100 772" style="stroke-width:7"/>
<path class="thin" d="M1300 710 L1300 760" marker-end="url(#a)"/>
<path class="w" d="M1220 780 L1235 860 H1365 L1380 780"/>
<text class="xs" x="1250" y="905">empty</text>

<!-- 5. no policy found -->
<path class="thin" d="M215 680 L215 760" marker-end="url(#a)"/>
<path class="r" d="M100 775 H620 V860 H100 Z" style="stroke-width:6"/>
<text class="t rd" x="125" y="835">no policy found</text>

<!-- 6. LIMIT then WHERE -->
<g transform="translate(100 900)"><path class="r" d="M0 0 H250 V85 H0 Z" style="stroke-width:6"/><text class="t rd" x="25" y="60">LIMIT 5</text></g>
<path class="r" d="M365 942 L475 942" style="stroke-width:6" marker-end="url(#ar)"/>
<g transform="translate(490 900)"><path class="r" d="M0 0 H330 V85 H0 Z" style="stroke-width:6"/><text class="t rd" x="25" y="60">WHERE role</text></g>

<!-- 7. Rule 1 -->
<text class="tk gd" x="100" y="1060">RULE: put the role filter inside the first query,</text>
<text class="tk gd" x="100" y="1125">before any top-k</text>
<path class="y" d="M100 1140 Q300 1132 480 1142"/>
<text class="s" x="130" y="1190">for the intern: WHERE before LIMIT</text>

<!-- PANEL 2 : Right filter, still cut -->
<circle class="w" cx="118" cy="1298" r="38"/><text class="h" x="98" y="1325">2</text>
<text class="h" x="188" y="1322">Right filter, still cut</text>

<!-- 1. filter at the front -->
<g transform="translate(100 1400)"><path class="w" d="M0 0 H470 V110 H0 Z"/><text class="t" x="30" y="72">WHERE role = intern</text></g>
<path class="thin" d="M585 1455 L665 1455" marker-end="url(#a)"/>
<g transform="translate(680 1400)"><path class="w" d="M0 0 H230 V110 H0 Z"/><text class="t" x="35" y="72">search</text></g>
<path class="thin" d="M925 1455 L1045 1455" marker-end="url(#a)"/>

<!-- 2. ranked list with #11 -->
<g transform="translate(1065 1380)">
  <text class="xs" x="0" y="40">1</text><path class="dimln" d="M60 28 H400"/>
  <text class="xs" x="0" y="88">2</text><path class="dimln" d="M60 76 H400"/>
  <text class="xs" x="0" y="136">3</text><path class="dimln" d="M60 124 H400"/>
  <text class="xs" x="0" y="184">4</text><path class="dimln" d="M60 172 H400"/>
  <text class="xs" x="0" y="232">5</text><path class="dimln" d="M60 220 H400"/>
  <text class="xs" x="0" y="300">6</text><path class="dimln" d="M60 288 H400"/>
  <text class="xs" x="0" y="348">7</text><path class="dimln" d="M60 336 H400"/>
  <text class="xs" x="0" y="396">8</text><path class="dimln" d="M60 384 H400"/>
  <text class="xs" x="0" y="444">9</text><path class="dimln" d="M60 432 H400"/>
  <text class="xs" x="0" y="492">10</text><path class="dimln" d="M60 480 H400"/>
  <text class="s" x="0" y="545">#11</text>
  <path class="w" d="M70 505 H420 V560 H70 Z"/><text class="xs" x="90" y="545">leave policy</text>
  <text class="xs" x="0" y="610">12</text><path class="dimln" d="M60 598 H400"/>
  <!-- 5. LIMIT 5 cut line -->
  <path class="r" d="M-60 254 H440"/>
  <text class="s rd" x="-200" y="268">LIMIT 5</text>
</g>

<!-- 3. doc -> vector, made before the question -->
<g transform="translate(100 1590)"><path class="w" d="M0 0 H150 V190 L120 210 H0 Z"/><path class="dimln" d="M25 45 H125 M25 85 H125 M25 125 H110"/></g>
<path class="thin" d="M270 1685 L370 1685" marker-end="url(#a)"/>
<text class="t cy" x="385" y="1700">[ 0.2, 0.7, 0.1 ... ]</text>
<path class="wdash" d="M380 1740 H880 V1820 H380 Z"/>
<text class="s" x="405" y="1795">made before the question</text>

<!-- 4. dot map: carry over and encashment inside leave -->
<path class="dimln" d="M100 2140 L100 1880 M100 2140 L880 2140"/>
<ellipse class="c" cx="480" cy="2010" rx="270" ry="105"/>
<text class="s cy" x="650" y="1905">leave</text>
<circle cx="440" cy="2015" r="14" fill="#fff"/><circle cx="478" cy="2005" r="14" fill="#fff"/>
<text class="xs" x="250" y="1990">carry over</text>
<text class="xs" x="500" y="2070">encashment</text>

<!-- 6. Rule 2 -->
<text class="tk gd" x="100" y="2245">RULE: fetch wide with the cheap search,</text>
<text class="tk gd" x="100" y="2310">then sort again before the cut</text>
<path class="y" d="M100 2325 Q450 2317 800 2327"/>
<text class="s" x="130" y="2375">for the intern: 50 in, 5 out</text>

<!-- PANEL 3 : The second sort -->
<circle class="w" cx="118" cy="2488" r="38"/><text class="h" x="98" y="2515">3</text>
<text class="h" x="188" y="2512">The second sort</text>

<!-- 1. top 50 -> reranker -->
<g transform="translate(100 2600)"><path class="w" d="M0 0 H230 V110 H0 Z"/><text class="t" x="35" y="72">top 50</text></g>
<path class="thin" d="M345 2655 L445 2655" marker-end="url(#a)"/>
<g transform="translate(460 2590)"><path class="c" d="M0 0 H340 V130 H0 Z" style="stroke-width:9"/><text class="t cy" x="45" y="82">reranker</text></g>
<path class="thin" d="M815 2655 L915 2655" marker-end="url(#a)"/>
<g transform="translate(930 2600)"><path class="w" d="M0 0 H200 V110 H0 Z"/><text class="t" x="35" y="72">top 5</text></g>

<!-- 2. question + doc read together -->
<g transform="translate(100 2790)">
  <path class="w" d="M0 0 H1040 V200 H0 Z"/>
  <text class="xs" x="30" y="45">question</text>
  <text class="s" x="30" y="115">can I <tspan class="cy">carry over</tspan> unused leave?</text>
  <path class="c" d="M120 128 H270"/>
  <path class="dimln" d="M560 20 V180"/>
  <text class="xs" x="590" y="45">document</text>
  <text class="s" x="590" y="115">interns may <tspan class="cy">carry over</tspan></text>
  <path class="c" d="M780 128 H935"/>
  <text class="xs" x="590" y="165">... unused days</text>
</g>

<!-- 3. #11 to #1 -->
<g transform="translate(1170 2600)">
  <text class="s" x="0" y="50">#1</text><path class="w" d="M80 10 H310 V70 H80 Z"/><text class="xs" x="95" y="52">leave policy</text>
  <text class="s" x="0" y="370">#11</text><path class="wdash" d="M80 330 H310 V390 H80 Z"/><text class="xs" x="105" y="372">was here</text>
  <path class="g" d="M330 360 Q400 210 325 55" marker-end="url(#ag)"/>
</g>

<!-- 4. cost -->
<text class="t" x="100" y="3100">1 call per doc</text>
<text class="t" x="400" y="3100">=</text>
<text class="t" x="450" y="3100">50 calls</text>

<!-- 5. #60 never reaches it -->
<g transform="translate(100 3150)"><path class="w" d="M0 0 H300 V80 H0 Z"/><text class="xs" x="25" y="52">#60 leave policy</text></g>
<path class="wdash" d="M440 3190 H620"/>
<path class="r" d="M500 3160 L560 3220 M560 3160 L500 3220"/>
<path class="w" d="M640 3140 L640 3240"/><text class="xs" x="655" y="3170">top 50</text>
<text class="s rd" x="100" y="3290">never reaches it</text>

<!-- 6. Rule 3 -->
<text class="tk gd" x="100" y="3400">RULE: log the cited doc's rank before reranking</text>
<path class="y" d="M100 3418 Q550 3410 1040 3420"/>
<text class="s" x="130" y="3480">for the leave policy: 11th</text>
</svg>
